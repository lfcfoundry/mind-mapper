<!doctype html><meta name="viewport" content="width=device-width, initial-scale=1"><title>Browser verification</title><pre id="result">Running…</pre><script>
(async()=>{
const report={userAgent:navigator.userAgent,dpr:devicePixelRatio,startedAt:new Date().toISOString(),kind:'Synthetic DOM/Canvas checks; physical gestures not tested',checks:[],errors:[]};
const check=(ok,name)=>{report.checks.push({name,passed:!!ok});if(!ok)throw Error(name);};
const wait=()=>new Promise(r=>setTimeout(r,100));
try{for(const width of [360,1280]){
 const frame=document.createElement('iframe');frame.style.cssText=`width:${width}px;height:950px;border:0`;document.body.append(frame);
 await new Promise((resolve,reject)=>{const timeout=setTimeout(()=>reject(Error(`${width}: frame load timed out`)),8000);frame.onload=()=>{clearTimeout(timeout);resolve();};frame.src='/mind-mapper.html';});await wait();
 const d=frame.contentDocument,w=frame.contentWindow,$=id=>d.getElementById(id),canvas=$('map'),stage=$('stage').getBoundingClientRect();
 check(canvas.width>0&&canvas.height>0,`${width}: Canvas initialized`);
 check(Math.abs(canvas.width-stage.width*w.devicePixelRatio)<=1,`${width}: DPR backing`);
 check($('outline').children.length===1,`${width}: initial outline`);
 const rootColor=w.getComputedStyle(d.documentElement).getPropertyValue('--root-surface').trim();
 const rgb=rootColor.slice(1).match(/../g).map(hex=>parseInt(hex,16));
 const area=canvas.getContext('2d').getImageData(Math.max(0,Math.floor(canvas.width/2-100)),Math.max(0,Math.floor(canvas.height/2-50)),Math.min(200,canvas.width),Math.min(100,canvas.height)).data;
 let rootPainted=false;for(let i=0;i<area.length;i+=4)if(area[i]===rgb[0]&&area[i+1]===rgb[1]&&area[i+2]===rgb[2]&&area[i+3]===255){rootPainted=true;break;}
 check(rootPainted,`${width}: root surface actually painted`);
 check($('outline').children[0].getAttribute('aria-label').startsWith('Root topic:'),`${width}: accessible root`);
 canvas.dispatchEvent(new w.MouseEvent('dblclick',{clientX:stage.left+stage.width/2,clientY:stage.top+stage.height/2,bubbles:true}));
 check(!$('editor').hidden,`${width}: Canvas direct editing`);
 const selection=$('outline').querySelector('[aria-selected=true]').textContent;
 canvas.dispatchEvent(new w.MouseEvent('dblclick',{clientX:stage.left+2,clientY:stage.top+2,bubbles:true}));
 check($('outline').querySelector('[aria-selected=true]').textContent===selection,`${width}: active edit selection protected`);
 $('label-input').value=' ';$('editor').requestSubmit();
 check(!$('editor').hidden&&$('label-input').getAttribute('aria-invalid')==='true'&&$('edit-error').textContent,`${width}: accessible validation error`);
 $('label-input').value='Browser verified root';$('editor').requestSubmit();await wait();
 check($('outline').children[0].textContent==='Browser verified root',`${width}: commit`);
 check(!$('label-input').hasAttribute('aria-invalid'),`${width}: validation state cleared`);
 $('add').click();check(!$('editor').hidden,`${width}: child editor`);
 $('outline').children[0].click();
 check($('outline').children[1].getAttribute('aria-selected')==='true',`${width}: outline cannot change active edit selection`);
 $('label-input').value='Child topic\nSecond line';$('editor').requestSubmit();await wait();
 check($('outline').children.length===2,`${width}: add child`);
 $('edit').click();$('label-input').value='Canceled';$('cancel').click();
 check(!$('outline').textContent.includes('Canceled'),`${width}: cancel`);
 $('undo').click();await wait();check($('outline').children[1].textContent==='New idea',`${width}: undo`);
 $('redo').click();await wait();check($('outline').children[1].textContent.includes('Child topic'),`${width}: redo`);
 for(const value of ['left-to-right','right-to-left','top-to-bottom','bottom-to-top','radial']){
 $('layout').value=value;$('layout').dispatchEvent(new w.Event('change'));await wait();check($('outline').children.length===2&&!$('undo').disabled,`${width}: ${value}`);}
 $('zoom-in').click();await wait();const zoom=$('zoom-label').textContent;$('zoom-out').click();await wait();check(zoom!==$('zoom-label').textContent,`${width}: zoom`);
 $('outline').children[0].click();check($('delete').disabled,`${width}: root protected`);
 canvas.dispatchEvent(new w.KeyboardEvent('keydown',{key:'ArrowRight',bubbles:true}));check($('outline').children[1].getAttribute('aria-selected')==='true',`${width}: keyboard`);
 check(width>700?d.querySelector('.workspace').getBoundingClientRect().width>stage.width:stage.width<=360,`${width}: responsive sizing`);
 report[width]={stageWidth:stage.width,stageHeight:stage.height};if(width===360)report.canvas=canvas.toDataURL();frame.remove();
}report.passed=true;}catch(e){report.passed=false;report.errors.push(e.stack||String(e));}
document.getElementById('result').textContent=JSON.stringify({...report,canvas:undefined},null,2);
try{const saved=await fetch('/report',{method:'POST',body:JSON.stringify(report)});if(!saved.ok)throw Error('Report endpoint returned '+saved.status);}catch(e){document.getElementById('result').textContent+='\nReport was not saved: '+e.message;}
})();</script>
